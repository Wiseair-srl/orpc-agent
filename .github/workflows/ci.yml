name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    services:
      # Real-server run of @orpc-agent/postgres's suite (incl. the T8
      # two-connection race); the suite self-skips when the URL is absent.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm build
      - run: pnpm check:api
      # The examples' committed capability snapshots are the framework's own
      # regression test on exposure semantics: a change to the registry or to
      # metadata normalization that moves what reaches a surface fails here.
      - run: pnpm check:capabilities
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:docs
      - run: pnpm docs:build

  # @orpc-agent/ai-sdk declares `ai: ^5.0.0 || ^6.0.0`, so the suite has to
  # hold on both majors — the `test` job above only covers v5 (the primary
  # devDependency). The v6 leg resolves through the `ai-v6` /
  # `@ai-sdk/provider-v3` aliased devDependencies, so it is lockfile-pinned:
  # `--frozen-lockfile` installs both majors and neither leg mutates the tree.
  ai-sdk-majors:
    name: ai-sdk (ai v${{ matrix.ai-major }})
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ai-major: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Types first: `tool()`/`jsonSchema()`/`ToolSet` drift between majors
      # would surface here, and the suite typechecks with the sources.
      - run: pnpm --filter @orpc-agent/ai-sdk typecheck:ai-v${{ matrix.ai-major }}
      - run: pnpm --filter @orpc-agent/ai-sdk test:ai-v${{ matrix.ai-major }}

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, ai-sdk-majors]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT so the release PR triggers CI; falls back to the default token until the secret exists
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
